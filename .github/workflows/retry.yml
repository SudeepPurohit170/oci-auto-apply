name: OCI Auto-Apply Retry

on:
  schedule:
    # Runs automatically every 15 minutes 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-oci-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Setup OCI Authentication
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY_CONTENT }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY}
          region=${OCI_REGION}
          key_file=~/.oci/oci_api_key.pem
          EOF

      - name: Trigger Stack Apply
        env:
          STACK_ID: ${{ secrets.STACK_OCID }}
        run: |
          echo "Submitting apply job for stack: $STACK_ID"
          JOB_OUTPUT=$(oci resource-manager job create-apply-job \
            --stack-id "$STACK_ID" \
            --execution-plan-strategy AUTO_APPROVED \
            --display-name "auto-retry-$(date +%s)" \
            --wait-for-state SUCCEEDED --wait-for-state FAILED \
            --wait-interval-seconds 15 --max-wait-seconds 120 2>&1 || true)

          echo "$JOB_OUTPUT"

          if echo "$JOB_OUTPUT" | grep -q '"lifecycle-state": "SUCCEEDED"'; then
            echo ">>> PROVISIONING SUCCESSFUL! <<<"
            exit 0
          else
            echo "Capacity still unavailable in Hyderabad. Next attempt scheduled."
          fi
